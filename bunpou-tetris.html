</style><main><header><div><small>IKIGAI EDUCATION</small><h1>文法テトリス • BUNPOU TETRIS</h1></div><div class="stats" id="stats">0 điểm • 0 combo</div></header><div class="prompt" id="prompt">桜の文法祭り</div><div class="meter"><i id="meter"></i></div><div class="field" id="field"><svg viewBox="0 0 900 300" preserveAspectRatio="xMidYMid slice"><rect width="900" height="300" fill="#192e48"/><circle cx="720" cy="70" r="43" fill="#f5d6a0"/><path d="M150 270L435 35 710 270Z" fill="#40586e"/><path d="M350 108L435 35 520 108 478 95 450 116 415 91 390 115Z" fill="#dce4e5"/><path d="M0 250Q150 190 300 250T600 250T900 250V300H0Z" fill="#213b49"/><g fill="#9c3937" stroke="#e1a16e" stroke-width="2"><path d="M80 85Q200 110 320 85L310 105H90Z"/><rect x="100" y="123" width="200" height="13"/><rect x="125" y="105" width="17" height="160"/><rect x="258" y="105" width="17" height="160"/></g><g fill="#b84743" stroke="#b88b52"><rect x="25" y="35" width="50" height="60" rx="18"/><rect x="825" y="35" width="50" height="60" rx="18"/></g><g fill="#f4a9bd"><ellipse cx="90" cy="40" rx="9" ry="4"/><ellipse cx="560" cy="50" rx="8" ry="4"/><ellipse cx="790" cy="140" rx="9" ry="4"/><ellipse cx="340" cy="180" rx="7" ry="4"/><ellipse cx="650" cy="210" rx="9" ry="4"/></g></svg><div class="cover" id="cover"><h2>桜の文法祭り</h2><p>500 câu • 25 bài • 20 câu/bài</p><label>Phạm vi <select id="lesson"><option value="0">Toàn bộ N5</option></select></label><label>Chế độ <select id="mode"><option value="learn">Luyện tập</option><option value="challenge">Thử thách • 3 mạng</option></select></label><button class="gold" id="start">▶ BẮT ĐẦU</button></div></div><div class="assembly" id="assembly">Chọn khối từ theo thứ tự</div><div class="feedback" id="feedback"></div><div class="controls"><button id="undo">↶ Hoàn tác</button><button id="repeat">🔊 Nghe lại</button><button id="exit">↩ Menu</button><button id="back">← Phòng học</button></div></main><script src="bunpou-bank.js?v=500-approved-1"></script><script>
const $=id=>document.getElementById(id);let queue=[],q,tiles=[],selected=[],score=0,combo=0,life=3,index=0,active=false,locked=false,raf=0,epoch=0,started=0,lastSentence='',challenge=false;const colors=['#9c3937','#27566a','#8a632f','#49634a','#65547b'];for(let i=1;i<=25;i++)$('lesson').add(new Option('Bài '+i+' • 20 câu',i));function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function rotate(){let r=document.documentElement;r.classList.toggle('rotate',navigator.maxTouchPoints>0&&innerHeight>innerWidth);r.style.setProperty('--w',innerHeight+'px');r.style.setProperty('--h',innerWidth+'px')}addEventListener('resize',rotate);rotate();function speak(text){return new Promise(resolve=>{try{if(navigator.audioSession)navigator.audioSession.type='playback';let synth=window.speechSynthesis,u=new SpeechSynthesisUtterance(text),done=false;window.currentUtterance=u;let end=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};u.lang='ja-JP';u.rate=.85;let v=synth.getVoices().find(v=>v.lang==='ja-JP');if(v)u.voice=v;u.onend=()=>end(true);u.onerror=()=>end(false);let timer=setTimeout(()=>{synth.cancel();end(false)},Math.max(7000,text.length*450));if(synth.speaking||synth.pending)synth.cancel();synth.resume();synth.speak(u)}catch{resolve(false)}})}function stats(){$('stats').textContent=score+' điểm • ×'+combo+' • '+(challenge?'♥'.repeat(life)+'♡'.repeat(3-life):'∞')}function clear(){tiles.forEach(t=>t.el.remove());tiles=[];selected=[];$('assembly').textContent='Chọn khối từ theo thứ tự'}function render(){let a=$('assembly');a.replaceChildren();selected.forEach(t=>{let s=document.createElement('span');s.className='placed';s.textContent=t.word;a.append(s)})}function next(){clear();if(index>=queue.length||life<=0){finish();return}q=queue[index];locked=false;$('prompt').textContent=(index+1)+'/'+queue.length+' • Bài '+q.lesson+' — '+q.vi;$('feedback').textContent='Xếp câu theo nghĩa tiếng Việt';let words=shuffle(q.parts);if(words.length>1&&words.join('')===q.parts.join(''))words.push(words.shift());words.forEach((word,i)=>{let el=document.createElement('button');el.className='tile';el.textContent=word;el.style.background=colors[i%colors.length];$('field').append(el);let t={word,el,i,chosen:false};tiles.push(t);el.onclick=()=>{if(!active||locked||t.chosen)return;t.chosen=true;el.style.visibility='hidden';selected.push(t);render();if(selected.length===q.parts.length)check()}});started=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function tick(now){if(!active||locked)return;let f=$('field'),w=f.clientWidth,h=f.clientHeight,elapsed=(now-started)/1000;tiles.forEach(t=>{let col=t.i%2,row=Math.floor(t.i/2),n=Math.ceil(tiles.length/2),space=Math.max(1,h-t.el.offsetHeight-8);t.el.style.left=Math.max(0,col*w/2+(w/2-t.el.offsetWidth)/2)+'px';t.el.style.top=(4+(row*space/n+elapsed*8)%space)+'px'});$('meter').style.width=challenge?Math.max(0,100-elapsed*4)+'%':'100%';if(challenge&&elapsed>=25){check(true);return}raf=requestAnimationFrame(tick)}
function valid(parts){if(parts.join('')===q.parts.join(''))return true;let canon=q.parts;if(parts.length!==canon.length||parts.at(-1)!==canon.at(-1))return false;let head=canon.slice(0,-1);const independent=s=>/^(わたしは|たなかさんは|きのう|きょう|あした|まいにち|いま|いっしょに|もう)$/.test(s)||/(で|へ|に|を|と|が)$/.test(s)&&!/(てから|とき|から|より|たら|ても|なければ|ては|ことが)$/.test(s);return head.length>1&&head.every(independent)&&parts.slice(0,-1).every((x,i,a)=>a.filter(y=>y===x).length===head.filter(y=>y===x).length)}
async function check(timeout=false){if(!active||locked||(!timeout&&selected.length!==q.parts.length))return;locked=true;let e=epoch,ok=!timeout&&valid(selected.map(t=>t.word));lastSentence=ok?selected.map(t=>t.word).join(''):q.parts.join('');if(ok){combo++;score+=100+combo*10}else{combo=0;if(challenge)life--}stats();$('feedback').textContent=(ok?'✓ Chính xác! ':'✗ Đáp án: ')+lastSentence;let spoken=await speak(lastSentence);if(e!==epoch)return;if(!spoken)$('feedback').textContent+=' • Không phát được giọng Nhật';await new Promise(r=>setTimeout(r,1000));if(e!==epoch)return;index++;next()}function finish(){active=false;locked=true;cancelAnimationFrame(raf);clear();$('cover').hidden=false;$('feedback').textContent='Kết thúc • '+score+' điểm • '+index+'/'+queue.length+' câu';$('start').textContent='▶ CHƠI LẠI'}$('start').onclick=async()=>{let e=++epoch;active=false;locked=true;clear();$('start').disabled=true;await speak('はじめましょう');$('start').disabled=false;if(e!==epoch)return;challenge=$('mode').value==='challenge';queue=shuffle(BUNPOU_BANK.filter(x=>!+$('lesson').value||x.lesson===+$('lesson').value));if(!$('lesson').value||$('lesson').value==='0')queue=queue.slice(0,30);index=score=combo=0;life=3;lastSentence='';active=true;$('cover').hidden=true;stats();next()};$('undo').onclick=()=>{if(locked||!selected.length)return;let t=selected.pop();t.chosen=false;t.el.style.visibility='visible';render()};$('repeat').onclick=()=>{if(!locked&&lastSentence)speak(lastSentence)};$('exit').onclick=()=>{epoch++;active=false;locked=true;cancelAnimationFrame(raf);speechSynthesis.cancel();clear();$('cover').hidden=false};$('back').onclick=()=>{if(parent!==window){parent.postMessage('bunpou-close',location.origin);return}window.close();if(!window.closed)location.href='./?v=bunpou-1'};
</script></html>
