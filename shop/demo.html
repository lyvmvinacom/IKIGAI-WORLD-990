<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IKIGAI SHOP – Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#10283c;color:#fff;font:15px system-ui}header{height:54px;display:flex;align-items:center;gap:12px;padding:8px 18px;background:#173d52;border-bottom:2px solid #c9a35b}header strong{color:#ffe0a0}header span{margin-left:auto}button{cursor:pointer;border:1px solid #bba16a;border-radius:8px;padding:8px 14px;background:#254c60;color:white;font:inherit}button.active,button.buy{background:#d5a94e;color:#142a37;font-weight:bold}button:disabled{opacity:.45;cursor:default}main{display:grid;grid-template-columns:34% 66%;height:calc(100dvh - 54px)}aside{padding:14px;background:radial-gradient(ellipse at center,#426d79,#142b40 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border-right:1px solid #bba16a}.stage{font-size:clamp(42px,12vh,100px);filter:drop-shadow(0 8px 8px #0008)}section{padding:12px;overflow:auto}.tabs{display:flex;gap:8px;position:sticky;top:0;background:#10283c;padding-bottom:10px;z-index:1}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px}.item{min-height:115px;background:#1e4055;border:1px solid #6c8490;border-radius:10px;padding:8px;text-align:center;cursor:pointer}.item.selected{outline:2px solid #ffe0a0}.item b{display:block;font-size:12px}.item small{color:#ffda87}.art{font-size:32px}.UR{border-color:#f5c95d}.SSR{border-color:#c28aff}.SR{border-color:#75c9f8}.note{font-size:11px;color:#b9d0db}h3{margin:4px 0}dialog{background:#173d52;color:white;border:1px solid #d5a94e;border-radius:12px;max-width:85vw}dialog::backdrop{background:#0009}@media(max-height:420px){header{height:42px}main{height:calc(100dvh - 42px)}aside,section{padding:7px}.item{min-height:92px}.art{font-size:25px}button{padding:5px 10px}}@media(orientation:portrait){main{grid-template-columns:1fr;height:auto}aside{min-height:210px}header{height:auto;flex-wrap:wrap}}
.shop-sprite{width:100%;height:100%;display:block;object-fit:contain}.art{height:76px}.stage{width:min(100%,240px);height:clamp(100px,43vh,260px);animation:shopFloat 3s ease-in-out infinite}.item:hover{box-shadow:0 0 12px #e6bb6c88;transform:translateY(-2px)}.item{transition:transform .15s,box-shadow .15s}.UR{box-shadow:inset 0 0 12px #e6bb6c44}@keyframes shopFloat{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.stage{animation:none}.item{transition:none}} </style><header><strong>IKIGAI EDUCATION</strong><button data-view="character">Nhân vật &amp; Túi đồ</button><button data-view="shop">Shop</button><span id="wallet"></span></header><main><aside><div class="note">BẢN DEMO • BỘ SƯU TẬP IKIGAI</div><div class="stage" id="preview"></div><h3 id="name"></h3><div id="detail"></div><button id="action" class="buy"></button><div class="note" id="equipped"></div></aside><section><div class="tabs"><button data-kind="character">Nhân vật</button><button data-kind="pet">Thú cưng</button></div><div class="items" id="items"></div></section></main><dialog id="confirm"><p id="question"></p><button id="yes" class="buy">Xác nhận</button> <button id="no">Hủy</button></dialog><script>

hop",kind='character',selected=catalog[0];const $=id=>document.getElementById(id);const fmt=n=>n.toLocaleString('vi-VN');const fallback=x=>x.kind==='pet'?['🦊','🐉','🐦','🐼','🐱','🦄','🐰','🐢','🐳','🐈'][Number(x.id.slice(3))-1]||'🐾':x.id.startsWith('FREE')?'🧑‍🎓':['⚔️','🌸','❄️','❄️','🔥','🌺','👑','👼','🥷','🥷','📚','📖','🏃','🏃','🦊','🦊','🐉','🐉','🔮','🌙','🏹','🧚','🔥','🔥'][Number(x.id.slice(3))-1];function art(x){if(x.id.startsWith("FREE"))return fallback(x);return '<img class="shop-sprite" src="sprites/'+x.id+'.png" alt="" loading="lazy">'}function list(){return (view==='shop'?catalog:all.filter(x=>owned.has(x.id))).filter(x=>x.kind===kind)}function render(){const l=list();if(!l.some(x=>x.id===selected?.id))selected=l[0]||null;$('wallet').textContent='🪙 '+fmt(coins)+' xu (demo)';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));$('items').replaceChildren();for(const x of l){const d=document.createElement('button');d.className='item '+x.rarity+(selected?.id===x.id?' selected':'');d.innerHTML='<div class="art">'+art(x)+'</div><b>'+x.name+'</b><small>'+x.rarity+' · '+(owned.has(x.id)?'Đã sở hữu':fmt(x.price)+' xu')+'</small>';d.onclick=()=>{selected=x;render()};$('items').append(d)}if(!l.length)$('items').textContent='Chưa có vật phẩm trong khu vực này.';$('preview').innerHTML=selected?art(selected):'—';$('name').textContent=selected?.name||'Chưa có vật phẩm';$('detail').textContent=selected?(owned.has(selected.id)?'Đã sở hữu':fmt(selected.price)+' xu')+' · '+selected.rarity:'';const a=$('action');a.disabled=!selected||(!owned.has(selected.id)&&coins<selected.price);a.textContent=!selected?'Chưa có':!owned.has(selected.id)?(coins<selected.price?'Không đủ xu':'Mua ngay'):equipment[kind]===selected.id?(kind==='pet'?'Tháo thú cưng':'Đang sử dụng'):'Trang bị';if(selected&&kind==='character'&&equipment[kind]===selected.id)a.disabled=tru
